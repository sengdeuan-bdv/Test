        // --- Welcome Screen Component ---
        function WelcomeScreen({ t, onLogin, lang, setLang }) {
            const [name, setName] = useState('');
            const [age, setAge] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (name.trim() && age.trim()) {
                    onLogin({ name, age });
                } else {
                    alert(t('req_name_age'));
                }
            };

            return (
                <div className="min-h-screen bg-rose-50 flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden animate-fade-in">
                        <div className="bg-rose-500 p-8 text-center text-white relative">
                            <div className="absolute top-4 right-4 flex gap-1 bg-black/10 p-1 rounded-xl">
                                <button onClick={() => setLang('lo')} className={`text-xs px-2 py-1 rounded-lg ${lang === 'lo' ? 'bg-white text-rose-600 font-bold' : 'hover:bg-black/10'}`}>LA</button>
                                <button onClick={() => setLang('th')} className={`text-xs px-2 py-1 rounded-lg ${lang === 'th' ? 'bg-white text-rose-600 font-bold' : 'hover:bg-black/10'}`}>TH</button>
                                <button onClick={() => setLang('en')} className={`text-xs px-2 py-1 rounded-lg ${lang === 'en' ? 'bg-white text-rose-600 font-bold' : 'hover:bg-black/10'}`}>EN</button>
                            </div>
                            <div className="bg-white/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                                <Icon name="HeartPulse" size={40} className="text-white" />
                            </div>
                            <h1 className="text-2xl font-bold mb-2">{t('welcome_title')}</h1>
                            <p className="text-rose-100">{t('welcome_sub')}</p>
                        </div>
                        <form onSubmit={handleSubmit} className="p-8 space-y-6">
                            <div>
                                <label className="block text-gray-700 font-bold mb-2 flex items-center gap-2">
                                    <Icon name="User" size={18} className="text-rose-500"/> {t('enter_name')}
                                </label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/20 outline-none transition-all" />
                            </div>
                            <div>
                                <label className="block text-gray-700 font-bold mb-2 flex items-center gap-2">
                                    <Icon name="Activity" size={18} className="text-rose-500"/> {t('enter_age')}
                                </label>
                                <input type="number" value={age} onChange={(e) => setAge(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/20 outline-none transition-all" />
                            </div>
                            <button type="submit" className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 text-lg">
                                {t('start_btn')}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Main App Component ---
        function App() {
            const [user, setUser] = useState(null); // ເກັບຂໍ້ມູນຜູ້ໃຊ້
            const [lang, setLang] = useState('lo');
            const [activeTab, setActiveTab] = useState('info');
            const [logs, setLogs] = useState([]);
            const [newLog, setNewLog] = useState({ date: '', time: 'time_m', conflict: '' });

            const [likes, setLikes] = useState(0);
            const [tabViews, setTabViews] = useState({ info: 1, food: 0, meds: 0, tracker: 0, report: 0, qna: 0 });

            const t = (key) => TRANSLATIONS[lang][key] || key;

            // ກວດສອບຖ້າຍັງບໍ່ລົງທະບຽນໃຫ້ສະແດງໜ້າ Welcome
            if (!user) {
                return <WelcomeScreen t={t} onLogin={setUser} lang={lang} setLang={setLang} />;
            }

            const handleTabSwitch = (tab) => {
                setActiveTab(tab);
                setTabViews(prev => ({ ...prev, [tab]: prev[tab] + 1 }));
            };

            const handleSaveLog = () => {
                if (newLog.date) {
                    setLogs([{ id: Date.now(), ...newLog }, ...logs]);
                    setNewLog({ date: '', time: 'time_m', conflict: '' });
                    alert(t('alert_save'));
                } else {
                    alert(t('alert_date'));
                }
            };

            const handleClearData = () => {
                const pwd = window.prompt(t('clear_prompt'));
                if (pwd === 'lp233') {
                    setLogs([]);
                    setLikes(0);
                    setTabViews({ info: 1, food: 0, meds: 0, tracker: 0, report: 0, qna: 0 });
                    alert(t('clear_success'));
                } else if (pwd !== null) {
                    alert(t('clear_fail'));
                }
            };

            const renderContent = () => {
                switch (activeTab) {
                    case 'info': return <InfoSection t={t} />;
                    case 'food': return <FoodSection t={t} />;
                    case 'meds': return <MedsSection t={t} />;
                    case 'tracker': return <TrackerSection t={t} logs={logs} newLog={newLog} setNewLog={setNewLog} handleSaveLog={handleSaveLog} />;
                    case 'report': return <ReportSection t={t} tabViews={tabViews} likes={likes} onClearData={handleClearData} />;
                    case 'qna': return <QnaSection t={t} />;
                    default: return <InfoSection t={t} />;
                }
            };

            return (
                <div className="min-h-screen w-full flex flex-col font-sans">
                    
                    {/* Header - Full Width */}
                    <header className="bg-rose-500 text-white p-4 md:py-5 md:px-8 shadow-md z-10">
                        <div className="max-w-7xl mx-auto w-full flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="bg-white p-3 rounded-full shadow-sm text-rose-500 hidden md:block">
                                    <Icon name="HeartPulse" size={32} />
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold leading-tight">{t('title')}</h1>
                                    <p className="text-sm text-rose-100 mt-1">
                                        {t('greeting')}, {user.name} ({user.age} {t('age_text')})
                                    </p>
                                </div>
                            </div>
                            
                            {/* Action Bar */}
                            <div className="flex items-center justify-between md:justify-end gap-3 md:gap-4">
                                <div className="flex items-center gap-1 bg-black/10 p-1.5 rounded-xl">
                                    <Icon name="Globe2" size={20} className="text-rose-100 ml-2 mr-2 hidden md:block" />
                                    <button onClick={() => setLang('lo')} className={`text-xs md:text-sm px-3 py-1.5 rounded-lg transition-all ${lang === 'lo' ? 'bg-white text-rose-600 font-bold shadow-sm' : 'text-white hover:bg-black/10'}`}>LA</button>
                                    <button onClick={() => setLang('th')} className={`text-xs md:text-sm px-3 py-1.5 rounded-lg transition-all ${lang === 'th' ? 'bg-white text-rose-600 font-bold shadow-sm' : 'text-white hover:bg-black/10'}`}>TH</button>
                                    <button onClick={() => setLang('en')} className={`text-xs md:text-sm px-3 py-1.5 rounded-lg transition-all ${lang === 'en' ? 'bg-white text-rose-600 font-bold shadow-sm' : 'text-white hover:bg-black/10'}`}>EN</button>
                                </div>
                                
                                <button onClick={() => setLikes(l => l + 1)} className="flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl transition-all active:scale-95 shadow-sm">
                                    <Icon name="ThumbsUp" size={20} />
                                    <span className="text-sm md:text-base font-bold">{likes}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area - Centered & Max Width */}
                    <main className="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8 flex flex-col justify-between">
                        <div>
                            {renderContent()}
                        </div>
                        
                        {/* Creator Footer inside Main container */}
                        <div className="mt-12 mb-24 md:mb-12 text-center text-sm md:text-base text-gray-400 font-medium">
                            {t('creator')}
                        </div>
                    </main>

                    {/* Bottom Navigation - Fixed Bottom, Max Width Container */}
                    <nav className="fixed bottom-0 w-full bg-white border-t border-rose-100 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-20">
                        <div className="max-w-7xl mx-auto flex justify-center gap-1 md:gap-8 px-1 md:px-8 p-2 pb-safe overflow-x-auto hide-scrollbar">
                            <TabButton active={activeTab === 'info'} onClick={() => handleTabSwitch('info')} icon={<Icon name="Info" size={24} />} label={t('tab_info')} />
                            <TabButton active={activeTab === 'food'} onClick={() => handleTabSwitch('food')} icon={<Icon name="Apple" size={24} />} label={t('tab_food')} />
                            <TabButton active={activeTab === 'meds'} onClick={() => handleTabSwitch('meds')} icon={<Icon name="Pill" size={24} />} label={t('tab_meds')} />
                            <TabButton active={activeTab === 'tracker'} onClick={() => handleTabSwitch('tracker')} icon={<Icon name="CalendarCheck" size={24} />} label={t('tab_tracker')} />
                            <TabButton active={activeTab === 'report'} onClick={() => handleTabSwitch('report')} icon={<Icon name="BarChart3" size={24} />} label={t('tab_report')} />
                            <TabButton active={activeTab === 'qna'} onClick={() => handleTabSwitch('qna')} icon={<Icon name="MessageSquare" size={24} />} label={t('tab_qna')} />
                        </div>
                    </nav>
                </div>
            );
        }

        // --- Subcomponents ---

        function TabButton({ active, onClick, icon, label }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center p-2 md:py-3 md:px-6 flex-1 min-w-[70px] max-w-[120px] rounded-xl transition-all ${active ? 'text-rose-600 bg-rose-50 shadow-sm' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'}`}>
                    <div className={`mb-1.5 ${active ? 'scale-110' : ''} transition-transform`}>
                        {icon}
                    </div>
                    <span className="text-[10px] md:text-sm font-bold whitespace-nowrap">{label}</span>
                </button>
            );
        }

        function InfoSection({ t }) {
            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="grid md:grid-cols-2 gap-6 items-center bg-rose-100/50 p-6 md:p-8 rounded-3xl border border-rose-100">
                        <div>
                            <h2 className="text-rose-800 font-bold text-xl md:text-2xl mb-4 flex items-start gap-3 leading-tight">
                                <Icon name="AlertCircle" size={28} className="text-rose-500 flex-shrink-0 mt-0.5" />
                                {t('what_is_anemia')}
                            </h2>
                            <p className="text-base md:text-lg text-gray-700 leading-relaxed max-w-4xl">
                                {t('anemia_desc')}
                            </p>
                        </div>
                        {/* ພາບປະກອບພາວະເລືອດຈາງ / ແມ່ຍິງຖືພາ */}
                        <img src="https://images.unsplash.com/photo-1531983412531-1f49a365ffed?auto=format&fit=crop&q=80&w=800" alt="Pregnancy" className="w-full h-48 md:h-64 object-cover rounded-2xl shadow-sm" />
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        <div className="md:col-span-2">
                            <div className="flex flex-col md:flex-row md:items-end justify-between mb-4">
                                <h3 className="font-bold text-xl text-gray-800 flex items-center gap-2">
                                    <Icon name="Activity" size={24} className="text-orange-500" /> {t('symptoms')}
                                </h3>
                                <p className="text-sm text-gray-500 italic mt-2 md:mt-0">{t('symptoms_note')}</p>
                            </div>
                            <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
                                {t('symp_list').map((symptom, i) => (
                                    <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 transition-transform hover:-translate-y-1">
                                        <div className="w-3 h-3 rounded-full bg-orange-400 flex-shrink-0"></div>
                                        <span className="text-sm md:text-base text-gray-700 font-bold">{symptom}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        {/* ພາບປະກອບອາການວິນຫົວ ເມື່ອຍລ້າ */}
                        <img src="https://images.unsplash.com/photo-1505528636417-646700c2834b?auto=format&fit=crop&q=80&w=800" alt="Dizziness Symptoms" className="w-full h-full min-h-[200px] object-cover rounded-3xl shadow-sm hidden md:block" />
                    </div>

                    <div>
                        <h3 className="font-bold text-xl text-gray-800 mb-4 flex items-center gap-2">
                            <Icon name="AlertCircle" size={24} className="text-red-500" /> {t('effects')}
                        </h3>
                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="bg-gradient-to-br from-pink-50 to-rose-50 p-6 rounded-3xl border border-pink-100">
                                <h4 className="font-bold text-lg text-pink-700 flex items-center gap-3 mb-4 border-b border-pink-200 pb-3">
                                    <Icon name="UserPlus" size={24} /> {t('eff_mom')}
                                </h4>
                                <ul className="text-base text-gray-700 space-y-3 list-disc list-inside marker:text-pink-400">
                                    {t('eff_mom_list').map((eff, i) => <li key={i}>{eff}</li>)}
                                </ul>
                            </div>
                            <div className="bg-gradient-to-br from-blue-50 to-cyan-50 p-6 rounded-3xl border border-blue-100">
                                <h4 className="font-bold text-lg text-blue-700 flex items-center gap-3 mb-4 border-b border-blue-200 pb-3">
                                    <Icon name="Baby" size={24} /> {t('eff_baby')}
                                </h4>
                                <ul className="text-base text-gray-700 space-y-3 list-disc list-inside marker:text-blue-400">
                                    {t('eff_baby_list').map((eff, i) => <li key={i}>{eff}</li>)}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function FoodSection({ t }) {
            const [selectedItem, setSelectedItem] = useState(null);

            const getImageForItem = (item) => {
                const imgMap = {
                    // ຊີ້ນໝູ & ຊີ້ນງົວ (ຮູບ Local ຕາມທີ່ແນບມາ)
                    'ຊີ້ນໝູ': 'ຊີ້ນໝູ.jpg',
                    'เนื้อหมู': 'ຊີ້ນໝູ.jpg',
                    'Pork': 'ຊີ້ນໝູ.jpg',
                    'ຊີ້ນງົວ': 'ຊີ້ນງົວ.jpg',
                    'เนื้อวัว': 'ຊີ້ນງົວ.jpg',
                    'Beef': 'ຊີ້ນງົວ.jpg',
                    // ຮູບອື່ນໆ (ດຶງຈາກອິນເຕີເນັດ)
                    'ຊີ້ນໄກ່': 'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&q=80&w=800',
                    'เนื้อไก่': 'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&q=80&w=800',
                    'Chicken': 'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&q=80&w=800',
                    'ໄຂ່ (ຕົ້ມກິນມີປະໂຫຍດສູງ)': 'https://images.unsplash.com/photo-1569246294372-ed319c674f14?auto=format&fit=crop&q=80&w=800',
                    'กลุ่มไข่ (ต้มกินจะมีประโยชน์สูง)': 'https://images.unsplash.com/photo-1569246294372-ed319c674f14?auto=format&fit=crop&q=80&w=800',
                    'Eggs (Boiled is highly beneficial)': 'https://images.unsplash.com/photo-1569246294372-ed319c674f14?auto=format&fit=crop&q=80&w=800'
                };
                return imgMap[item] || 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&q=80&w=800'; // ຮູບທົ່ວໄປຖ້າບໍ່ມີໃນລາຍການ
            };

            const handleItemClick = (item) => {
                setSelectedItem({
                    name: item,
                    src: getImageForItem(item)
                });
            };

            return (
                <div className="space-y-8 animate-fade-in relative">
                    <div className="text-center mb-8">
                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800">{t('food_title')}</h2>
                        <p className="text-base md:text-lg text-gray-500 mt-2">{t('food_sub')} <span className="text-rose-500 font-bold">(ຄລິກທີ່ຊື່ອາຫານເພື່ອເບິ່ງຮູບ)</span></p>
                    </div>
                    <div className="grid md:grid-cols-3 gap-6">
                        <FoodCategory 
                            title={t('meat_title')} 
                            color="bg-red-50 border-red-200 text-red-800" 
                            items={t('meat_list')} 
                            imgSrc="https://images.unsplash.com/photo-1607623814075-e51df1bd682f?auto=format&fit=crop&q=80&w=800"
                            onItemClick={handleItemClick}
                        />
                        <FoodCategory 
                            title={t('veg_title')} 
                            color="bg-green-50 border-green-200 text-green-800" 
                            items={t('veg_list')} 
                            imgSrc="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&q=80&w=800"
                            onItemClick={handleItemClick}
                        />
                        <FoodCategory 
                            title={t('absorb_title')} 
                            color="bg-orange-50 border-orange-200 text-orange-800" 
                            items={t('absorb_list')} 
                            imgSrc="https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&q=80&w=800"
                            onItemClick={handleItemClick}
                        />
                    </div>

                    {/* ປັອບອັບສະແດງຮູບ (Modal) */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setSelectedItem(null)}>
                            <div className="bg-white p-6 rounded-3xl max-w-md w-full relative shadow-2xl animate-fade-in" onClick={e => e.stopPropagation()}>
                                <button className="absolute top-4 right-4 bg-gray-100 text-gray-600 rounded-full p-2 hover:bg-red-100 hover:text-red-600 transition-colors" onClick={() => setSelectedItem(null)}>
                                    <Icon name="XCircle" size={24} />
                                </button>
                                <h3 className="font-bold text-xl text-center mb-4 text-gray-800 border-b pb-3 mr-8">{selectedItem.name}</h3>
                                <img 
                                    src={selectedItem.src} 
                                    alt={selectedItem.name} 
                                    className="w-full h-auto max-h-[60vh] object-cover rounded-2xl shadow-inner border border-gray-100" 
                                    onError={(e) => { 
                                        e.target.onerror = null; 
                                        e.target.src = 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&q=80&w=800'; 
                                    }} 
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function FoodCategory({ title, items, color, imgSrc, onItemClick }) {
            return (
                <div className={`p-6 rounded-3xl border flex flex-col ${color} h-full overflow-hidden relative`}>
                    <img src={imgSrc} alt={title} className="w-full h-32 md:h-40 object-cover rounded-2xl mb-4 shadow-sm" />
                    <h3 className="font-bold text-lg mb-4 border-b border-current pb-2 opacity-90">{title}</h3>
                    <div className="flex flex-wrap gap-2">
                        {items.map((item, i) => (
                            <span 
                                key={i} 
                                onClick={() => onItemClick && onItemClick(item)}
                                className="bg-white/90 px-3 py-1.5 rounded-full text-sm shadow-sm font-bold border border-white/50 hover:bg-white hover:scale-105 hover:shadow-md transition-all cursor-pointer select-none">
                                {item}
                            </span>
                        ))}
                    </div>
                </div>
            );
        }

        function MedsSection({ t }) {
            return (
                <div className="space-y-6 animate-fade-in max-w-5xl mx-auto">
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center gap-6">
                        {/* ພາບຢາທາດເຫຼັກ */}
                        <img src="https://images.unsplash.com/photo-1584308666744-24d5e4a81aa4?auto=format&fit=crop&q=80&w=800" alt="Iron Pills" className="w-full md:w-56 h-40 md:h-48 object-cover rounded-2xl shadow-sm" />
                        <div className="text-center md:text-left flex-1">
                            <h2 className="font-bold text-gray-800 text-2xl mb-2">{t('meds_title')}</h2>
                            <p className="text-xl font-bold text-rose-600 mb-2">FERROUS FUMARATE 200 MG</p>
                            <p className="text-lg text-gray-600">{t('meds_dose')}</p>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        <div className="bg-green-50 p-6 rounded-3xl border border-green-200">
                            <h3 className="font-bold text-green-800 text-lg mb-3 flex items-center gap-2">
                                <Icon name="CheckCircle2" size={24} className="flex-shrink-0" /> {t('meds_how')}
                            </h3>
                            <p className="text-base text-gray-700 leading-relaxed">{t('meds_how_desc')}</p>
                        </div>

                        <div className="bg-red-50 p-6 rounded-3xl border border-red-200 flex flex-col h-full">
                            <h3 className="font-bold text-red-800 text-lg mb-3 flex items-center gap-2">
                                <Icon name="XCircle" size={24} className="flex-shrink-0" /> {t('meds_avoid')}
                            </h3>
                            {/* ພາບກາແຟ/ນົມ ທີ່ຄວນຫຼີກລ້ຽງ */}
                            <img src="https://images.unsplash.com/photo-1495474472201-444cb3f92d47?auto=format&fit=crop&q=80&w=800" alt="Avoid Coffee and Milk" className="w-full h-32 object-cover rounded-xl mb-4 shadow-sm" />
                            <p className="text-base text-gray-700 mb-4 leading-relaxed">{t('meds_avoid_desc')}</p>
                            <div className="bg-white/80 p-4 rounded-xl text-sm font-medium text-red-800 flex gap-3 items-start shadow-sm border border-red-100 mt-auto">
                                <Icon name="Clock" size={20} className="flex-shrink-0" />
                                <p>{t('meds_avoid_note')}</p>
                            </div>
                        </div>

                        <div className="bg-yellow-50 p-6 rounded-3xl border border-yellow-200">
                            <h3 className="font-bold text-yellow-800 text-lg mb-4 flex items-center gap-2">
                                <Icon name="AlertCircle" size={24} className="flex-shrink-0" /> {t('meds_side')}
                            </h3>
                            <ul className="text-base text-gray-700 space-y-3">
                                {t('meds_side_list').map((side, i) => <li key={i} className="flex gap-3 items-center"><div className="w-2 h-2 bg-yellow-500 rounded-full"></div>{side}</li>)}
                                <li className="bg-yellow-200/60 p-4 rounded-xl text-yellow-900 font-bold text-sm mt-4 border border-yellow-300 shadow-sm">
                                    {t('meds_side_sol')}
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        function TrackerSection({ t, logs, newLog, setNewLog, handleSaveLog }) {
            return (
                <div className="space-y-8 animate-fade-in max-w-6xl mx-auto">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-rose-600">{t('track_title')}</h2>
                        <p className="text-base md:text-lg text-gray-500 mt-2">{t('track_sub')}</p>
                    </div>

                    <div className="grid lg:grid-cols-2 gap-8">
                        {/* Form */}
                        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-200 h-fit">
                            <h3 className="font-bold text-xl text-gray-800 mb-6 border-b pb-4">{t('track_new')}</h3>
                            <div className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-600 mb-2">{t('track_date')}</label>
                                    <input type="date" value={newLog.date} onChange={(e) => setNewLog({...newLog, date: e.target.value})} className="w-full border border-gray-300 rounded-xl p-3.5 text-base focus:ring-4 focus:ring-rose-500/20 focus:border-rose-500 outline-none transition-all bg-gray-50 hover:bg-white" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-600 mb-2">{t('track_time')}</label>
                                    <div className="flex gap-3">
                                        {['time_m', 'time_a', 'time_e'].map((timeKey) => (
                                            <button key={timeKey} onClick={() => setNewLog({...newLog, time: timeKey})} className={`flex-1 py-3.5 rounded-xl text-sm md:text-base font-bold transition-all border ${newLog.time === timeKey ? 'bg-rose-500 text-white border-rose-500 shadow-lg transform scale-[1.02]' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100 hover:border-gray-300'}`}>
                                                {t(timeKey)}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-600 mb-2">{t('track_note')}</label>
                                    <input type="text" placeholder={t('track_note_ph')} value={newLog.conflict} onChange={(e) => setNewLog({...newLog, conflict: e.target.value})} className="w-full border border-gray-300 rounded-xl p-3.5 text-base focus:ring-4 focus:ring-rose-500/20 focus:border-rose-500 outline-none transition-all bg-gray-50 hover:bg-white" />
                                </div>
                                <button onClick={handleSaveLog} className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-xl mt-6 flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg active:scale-95 text-lg">
                                    <Icon name="Save" size={24} /> {t('track_save')}
                                </button>
                            </div>
                        </div>

                        {/* History */}
                        <div className="bg-gray-50/50 p-6 md:p-8 rounded-3xl border border-gray-200 h-fit">
                            <h3 className="font-bold text-xl text-gray-800 mb-6 pl-2">{t('track_hist')}</h3>
                            {logs.length === 0 ? (
                                <div className="bg-white border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center">
                                    <p className="text-base text-gray-400 font-medium">{t('track_empty')}</p>
                                </div>
                            ) : (
                                <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                                    {logs.map((log) => (
                                        <div key={log.id} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-2 hover:border-rose-300 hover:shadow-md transition-all">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-gray-800 text-lg">{log.date}</span>
                                                <span className="text-sm bg-rose-100 text-rose-800 px-4 py-1.5 rounded-full font-bold">{t(log.time)}</span>
                                            </div>
                                            <div className="text-sm md:text-base text-gray-600 flex items-start gap-2 mt-1">
                                                <Icon name="Coffee" size={20} className="text-gray-400 flex-shrink-0" />
                                                <span>{log.conflict || <span className="italic text-gray-400">{t('track_no_conflict')}</span>}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ReportSection({ t, tabViews, likes, onClearData }) {
            const totalViews = Object.values(tabViews).reduce((a, b) => a + b, 0);

            return (
                <div className="space-y-8 animate-fade-in max-w-5xl mx-auto">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-rose-600">{t('rep_title')}</h2>
                        <p className="text-base md:text-lg text-gray-500 mt-2">{t('rep_sub')}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-6 md:gap-8">
                        <div className="bg-gradient-to-br from-rose-400 to-rose-600 p-8 md:p-10 rounded-3xl shadow-lg text-white flex flex-col items-center justify-center transform transition-transform hover:-translate-y-2">
                            <Icon name="ThumbsUp" size={48} className="mb-4 opacity-90" />
                            <p className="text-5xl md:text-6xl font-black">{likes}</p>
                            <p className="text-sm md:text-lg font-bold opacity-90 text-center mt-2">{t('rep_likes')}</p>
                        </div>
                        
                        <div className="bg-gradient-to-br from-blue-400 to-blue-600 p-8 md:p-10 rounded-3xl shadow-lg text-white flex flex-col items-center justify-center transform transition-transform hover:-translate-y-2">
                            <Icon name="Activity" size={48} className="mb-4 opacity-90" />
                            <p className="text-5xl md:text-6xl font-black">{totalViews}</p>
                            <p className="text-sm md:text-lg font-bold opacity-90 text-center mt-2">{t('rep_views')}</p>
                        </div>
                    </div>

                    <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-gray-200">
                        <h3 className="font-bold text-xl text-gray-800 mb-8 border-b pb-4">{t('rep_stat')}</h3>
                        <div className="grid md:grid-cols-2 gap-x-12 gap-y-8">
                            <StatRow icon={<Icon name="Info" size={24} className="text-blue-500" />} label={t('tab_info')} count={tabViews.info} total={totalViews} color="bg-blue-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="Apple" size={24} className="text-green-500" />} label={t('tab_food')} count={tabViews.food} total={totalViews} color="bg-green-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="Pill" size={24} className="text-rose-500" />} label={t('tab_meds')} count={tabViews.meds} total={totalViews} color="bg-rose-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="CalendarCheck" size={24} className="text-orange-500" />} label={t('tab_tracker')} count={tabViews.tracker} total={totalViews} color="bg-orange-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="BarChart3" size={24} className="text-purple-500" />} label={t('tab_report')} count={tabViews.report} total={totalViews} color="bg-purple-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="MessageSquare" size={24} className="text-teal-500" />} label={t('tab_qna')} count={tabViews.qna} total={totalViews} color="bg-teal-500" suffix={t('rep_times')} />
                        </div>
                        
                        {/* Clear Data Button */}
                        <div className="mt-10 pt-6 border-t border-gray-100 flex justify-end">
                            <button onClick={onClearData} className="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition-all">
                                <Icon name="Trash2" size={20} /> {t('clear_data')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StatRow({ icon, label, count, total, color, suffix }) {
            const percentage = total === 0 ? 0 : Math.round((count / total) * 100);
            return (
                <div>
                    <div className="flex justify-between items-center mb-3">
                        <div className="flex items-center gap-3">
                            {icon}
                            <span className="text-base font-bold text-gray-700">{label}</span>
                        </div>
                        <span className="text-sm font-bold text-gray-800 bg-gray-100 px-3 py-1 rounded-lg">{count} {suffix}</span>
                    </div>
                    <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                        <div className={`${color} h-3 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${percentage}%` }}></div>
                    </div>
                </div>
            );
        }

        function QnaSection({ t }) {
            const [feedback, setFeedback] = useState('');

            const handleSubmitFeedback = () => {
                if (feedback.trim() === '') return;
                alert(t('fb_alert'));
                setFeedback('');
            };

            return (
                <div className="space-y-8 animate-fade-in max-w-6xl mx-auto">
                    <div className="grid lg:grid-cols-2 gap-8">
                        {/* FAQ Section */}
                        <div className="space-y-6">
                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-3 mb-2">
                                <Icon name="HelpCircle" size={28} className="text-teal-500" /> {t('faq_title')}
                            </h2>
                            
                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:border-teal-200 transition-colors">
                                    <h3 className="font-bold text-gray-800 text-base md:text-lg mb-2 flex items-start gap-3">
                                        <span className="text-teal-500 font-black">Q:</span> {t('faq_1_q')}
                                    </h3>
                                    <p className="text-base text-gray-600 pl-8 leading-relaxed">
                                        <span className="text-rose-500 font-bold">A:</span> {t('faq_1_a')}
                                    </p>
                                </div>
                                
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:border-teal-200 transition-colors">
                                    <h3 className="font-bold text-gray-800 text-base md:text-lg mb-2 flex items-start gap-3">
                                        <span className="text-teal-500 font-black">Q:</span> {t('faq_2_q')}
                                    </h3>
                                    <p className="text-base text-gray-600 pl-8 leading-relaxed">
                                        <span className="text-rose-500 font-bold">A:</span> {t('faq_2_a')}
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Feedback Section */}
                        <div className="bg-gradient-to-b from-teal-50 to-white p-6 md:p-8 rounded-3xl border border-teal-100 shadow-sm h-fit">
                            <h2 className="font-bold text-xl md:text-2xl text-teal-800 mb-6 flex items-center gap-3">
                                <Icon name="MessageSquare" size={28} /> {t('fb_title')}
                            </h2>
                            <textarea
                                value={feedback}
                                onChange={(e) => setFeedback(e.target.value)}
                                placeholder={t('fb_ph')}
                                className="w-full h-40 p-4 rounded-2xl border border-teal-200 text-base focus:ring-4 focus:ring-teal-500/20 focus:border-teal-500 outline-none resize-none mb-6 bg-white transition-all"
                            />
                            <button 
                                onClick={handleSubmitFeedback}
                                className="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold text-lg py-4 rounded-2xl flex items-center justify-center gap-3 transition-all shadow-md active:scale-95 hover:shadow-lg"
                            >
                                <Icon name="Send" size={24} /> {t('fb_submit')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
